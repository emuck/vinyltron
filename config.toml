[volumio]
host = "volumio.local"
port = 3000
artwork_enabled = true

[display]
brightness = 80
gamma = 2.2
slowdown_gpio = 2
limit_refresh_rate_hz = 0 # 0 = uncapped; tune if a panel shows flicker or refresh hiccups
rows = 64
cols = 64
rotation = 270
display_on = true
hardware_mapping = "adafruit-hat-pwm" # requires GPIO4->GPIO18 bonnet quality jumper; use "adafruit-hat" without it
disable_hardware_pulsing = false   # true was required for direct GPIO; bonnet handles PWM
panel_type = ""          # set to "FM6126A" if colors/timing are wrong

[schedule]
enabled = false
on_time = "08:00"
off_time = "23:00"

[fallback]
image = "assets/idle.png"
image_folder = "/data/INTERNAL/Vinyltron/idle-images"
mode = "single"          # single | selected | random_folder | screensaver
selected_image = ""      # basename inside image_folder
rotate_seconds = 300     # random_folder only; 0 disables idle photo rotation

[screensaver]
engine = "brians_brain"  # brians_brain
palette = "cyan_amber"   # cyan_amber | green_magenta | blue_red | white_violet
fps = 6                  # clamped to 2-24
reset_seconds = 300      # 0 disables periodic random reset
startup_delay_seconds = 120 # show built-in image before starting screensaver after service start
density = 0.22           # initial ready-cell density for Brian's Brain
seed = ""                # optional deterministic seed; blank = random each daemon start

[overlays]
progress_bar = false       # legacy compatibility; progress_bar_height = 0 disables the bar
progress_bar_height = 0
progress_bar_foreground = [255, 255, 255]
progress_bar_background = [] # empty = use album art as the track background
format_badge = false       # compact format text overlay
format_font = "tom_thumb"  # tom_thumb | tiny5 | spleen
format_font_path = ""      # optional custom BDF path; built-in choices have default paths
badge_duration = 10
