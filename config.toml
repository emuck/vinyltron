[volumio]
host = "volumio.local"
port = 3000

[display]
brightness = 80
gamma = 2.2
slowdown_gpio = 2
rows = 64
cols = 64
rotation = 270
display_on = true
panel_type = ""          # set to "FM6126A" if colors/timing are wrong

[fallback]
image = "assets/idle.png"

[overlays]
progress_bar = false       # legacy compatibility; progress_bar_height = 0 disables the bar
progress_bar_height = 0
progress_bar_foreground = [255, 255, 255]
progress_bar_background = [] # empty = use album art as the track background
format_badge = false       # compact format text overlay
format_font = "tom_thumb"  # tom_thumb | tiny5
format_font_path = ""      # optional custom BDF path; tiny5 defaults to assets/fonts/Tiny5.bdf
badge_duration = 10
# Future analog-source/badge placement options:
# badge_position = "top-right"
# badge_opacity = 0.75
